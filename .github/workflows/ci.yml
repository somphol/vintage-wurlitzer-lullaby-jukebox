name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Engine, repository and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Engine and repository suites
        run: node --test tests/engine.test.mjs tests/static.test.mjs

      - name: Locate Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME=$(command -v chromium)" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/google-chrome ]; then
            echo "CHROME=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            echo "No Chrome found" && exit 1
          fi

      - name: Headless browser suite
        run: node tests/browser.test.mjs

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-shots
          path: |
            assets/*.png
            /tmp/wurlitzer-*.png
          if-no-files-found: ignore
